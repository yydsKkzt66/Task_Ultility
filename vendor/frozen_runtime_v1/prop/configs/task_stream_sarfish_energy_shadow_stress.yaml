mode: observation_window
orbit_period_min: 90
num_days: 1
slot_seconds: 20
observation_windows_per_orbit: [2, 3]
window_duration_s_range: [180, 360]
intra_window_task_interval_slots: [1, 2]
background_task_probability: 0.02
emergency_window_probability: 0.20
high_value_window_probability: 0.35
forced_windows_s:
  - window_id: eclipse_burst_0
    start_s: 3300
    end_s: 4380
    interval_s: 40
    task_class: emergency
    replace_existing: true
  - window_id: eclipse_burst_1
    start_s: 8700
    end_s: 9780
    interval_s: 40
    task_class: high_value
    replace_existing: true
