variants:
  - proposed_yolo_profile_policy_repair_baseline
  - proposed_calibrated_payload_profile
  - proposed_payload_specific_delivery_proxy
  - proposed_calibrated_payload_plus_cost_aware_ucb
  - proposed_calibrated_payload_plus_z_guided
  - proposed_payload_repaired_combined
  - utility_rule
  - no_mode
  - no_lyapunov
  - fixed_lightweight
  - fixed_high_accuracy
policy_repair_defaults:
  enable_cost_aware_ucb: false
  enable_delivery_aware_info_gain: false
  enable_payload_specific_delivery_proxy: false
  enable_z_guided_coupling: false
  cost_aware_ucb:
    min_discount: 0.18
    energy_ref_j: 55.0
    latency_ref_s: 3.0
    payload_ref_mb: 2.7
    thermal_delta_ref: 0.10
    energy_weight: 0.28
    latency_weight: 0.10
    payload_weight: 0.22
    thermal_weight: 0.22
    dod_weight: 0.38
    eclipse_weight: 0.22
    no_contact_weight: 0.28
    queue_weight: 0.18
    deadline_weight: 0.14
    dod_reason_threshold: 0.30
    queue_reason_threshold: 0.20
    deadline_reason_threshold: 0.70
  delivery_aware_info_gain:
    min_proxy: 0.30
    metadata_floor: 0.85
    metadata_info_threshold: 0.55
    payload_ref_mb: 2.7
    soc_guard: 0.70
    queue_weight: 0.28
    payload_weight: 0.38
    deadline_weight: 0.34
    no_contact_weight: 0.28
    contact_shortfall_weight: 0.18
    eclipse_weight: 0.08
    low_soc_weight: 0.12
    queue_reason_threshold: 0.20
    payload_reason_threshold: 0.80
    deadline_reason_threshold: 0.50
  z_guided_coupling:
    min_beta_scale: 0.35
    dod_threshold: 0.30
    thermal_threshold: 0.85
    queue_threshold: 0.15
    dod_lambda_E_multiplier: 1.45
    dod_beta_multiplier: 0.80
    eclipse_lambda_E_multiplier: 1.25
    eclipse_lambda_S_multiplier: 1.12
    eclipse_beta_multiplier: 0.88
    thermal_lambda_S_multiplier: 1.45
    thermal_lambda_E_multiplier: 1.18
    thermal_beta_multiplier: 0.82
    queue_lambda_Q_multiplier: 1.35
    queue_lambda_S_multiplier: 1.25
    no_contact_lambda_S_multiplier: 1.30
    no_contact_lambda_Q_multiplier: 1.12
    no_contact_beta_multiplier: 0.88
payload_profile_variants:
  proposed_yolo_profile_policy_repair_baseline: original
  proposed_calibrated_payload_profile: calibrated
  proposed_payload_specific_delivery_proxy: calibrated
  proposed_calibrated_payload_plus_cost_aware_ucb: calibrated
  proposed_calibrated_payload_plus_z_guided: calibrated
  proposed_payload_repaired_combined: calibrated
  utility_rule: calibrated
  no_mode: calibrated
  no_lyapunov: calibrated
  fixed_lightweight: calibrated
  fixed_high_accuracy: calibrated
variant_overrides:
  proposed_payload_specific_delivery_proxy:
    enable_delivery_aware_info_gain: true
    enable_payload_specific_delivery_proxy: true
  proposed_calibrated_payload_plus_cost_aware_ucb:
    enable_cost_aware_ucb: true
  proposed_calibrated_payload_plus_z_guided:
    enable_z_guided_coupling: true
  proposed_payload_repaired_combined:
    enable_cost_aware_ucb: true
    enable_delivery_aware_info_gain: true
    enable_payload_specific_delivery_proxy: true
    enable_z_guided_coupling: true
