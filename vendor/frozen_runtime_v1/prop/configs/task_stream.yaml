mode: observation_window
orbit_period_min: 90
num_days: 1
slot_seconds: 60
observation_windows_per_orbit: [2, 4]
window_duration_s_range: [360, 720]
intra_window_task_interval_slots: [1, 2]
background_task_probability: 0.03
emergency_window_probability: 0.15
high_value_window_probability: 0.25
task_value_model:
  enable_mission_prior_value_v2: false
  clip_min: 0.05
  clip_max: 0.95
  weights:
    task_class: 0.50
    evidence_need: 0.25
    area_prior: 0.15
    source_priority: 0.10
  task_class_map:
    routine: 0.25
    high_value: 0.70
    emergency: 0.95
  evidence_need_map:
    alert: 0.25
    metadata: 0.25
    verification: 0.65
    confirmation: 0.65
    context: 0.75
    evidence: 0.85
    closure: 0.85
    emergency_evidence: 0.95
  area_prior_mode: deterministic_scene_hash
  area_prior_values:
    low: 0.20
    medium: 0.50
    high: 0.80
  source_priority_default: 0.0
  include_deadline_class: false
