description: 1-day BUPT-1-grounded stress timeline candidate. Contact/task fields are consumed by validation scripts without changing generator code.
use_num_days: true
num_days: 1
slot_seconds: 20
task_arrival: observation_window
trace_mode: synthetic
physical_horizon_s: 86400
orbit_reference:
  orbit_type: sun_synchronous_like
  altitude_km: 500
  inclination_deg: 97
contact:
  contact_period_s: 5700
  contact_duration_s: 300
  contact_phase_offset_s: 420
  throughput_min_mbps: 20.0
  throughput_max_mbps: 30.0
  snr_min_db: 5.0
  snr_span_db: 10.0
  link_quality_period_s: 1800
  link_quality_phase: 0.5
  outage_windows_s:
    - [15600, 21300]
    - [38400, 44100]
    - [61200, 66900]
task_stream_overrides:
  observation_windows_per_orbit: [2, 3]
  window_duration_s_range: [180, 360]
  intra_window_task_interval_slots: [1, 2]
  background_task_probability: 0.015
  emergency_window_probability: 0.18
  high_value_window_probability: 0.35
  forced_windows_s:
    - window_id: bupt1_stress_eclipse_burst_0
      start_s: 3300
      end_s: 4380
      interval_s: 40
      task_class: emergency
      replace_existing: true
    - window_id: bupt1_stress_high_value_burst_1
      start_s: 8700
      end_s: 9780
      interval_s: 40
      task_class: high_value
      replace_existing: true
deadline_distribution_target_minutes:
  routine: [20, 120]
  high_value: [15, 60]
  emergency: [10, 45]
deadline_distribution_status: target_only_current_dataset_adapter_uses_hardcoded_seconds
