description: SARFishSample 1-day nominal BUPT-1 task stream with authority-grounded minute-scale deadlines.
mode: observation_window
orbit_period_min: 95
num_days: 1
slot_seconds: 20
observation_windows_per_orbit: [2, 3]
window_duration_s_range: [240, 360]
intra_window_task_interval_slots: [2, 3]
background_task_probability: 0.005
emergency_window_probability: 0.12
high_value_window_probability: 0.28
forced_windows_s: []
deadline_policy: authority_grounded_minutes
deadline_policy_notes: Deadlines are mission-level service latency priors from task class, not label-derived target content.
ordinary_deadline_min_minutes: 90
ordinary_deadline_max_minutes: 240
high_value_deadline_min_minutes: 45
high_value_deadline_max_minutes: 120
emergency_deadline_min_minutes: 20
emergency_deadline_max_minutes: 90
