description: SARFishSample 1-day stress BUPT-1 task stream with authority-grounded minute-scale deadlines.
mode: observation_window
orbit_period_min: 95
num_days: 1
slot_seconds: 20
observation_windows_per_orbit: [2, 3]
window_duration_s_range: [180, 360]
intra_window_task_interval_slots: [1, 2]
background_task_probability: 0.015
emergency_window_probability: 0.18
high_value_window_probability: 0.35
forced_windows_s:
  - window_id: bupt1_stress_eclipse_burst_0
    start_s: 3300
    end_s: 4380
    interval_s: 40
    task_class: emergency
    replace_existing: true
  - window_id: bupt1_stress_high_value_burst_1
    start_s: 8700
    end_s: 9780
    interval_s: 40
    task_class: high_value
    replace_existing: true
deadline_policy: authority_grounded_minutes
deadline_policy_notes: Deadlines are mission-level service latency priors from task class, not label-derived target content.
ordinary_deadline_min_minutes: 60
ordinary_deadline_max_minutes: 180
high_value_deadline_min_minutes: 30
high_value_deadline_max_minutes: 90
emergency_deadline_min_minutes: 15
emergency_deadline_max_minutes: 60
