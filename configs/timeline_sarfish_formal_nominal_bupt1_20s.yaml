description: 1-day BUPT-1-grounded nominal timeline candidate. Contact/task fields are consumed by validation scripts without changing generator code.
use_num_days: true
num_days: 1
slot_seconds: 20
task_arrival: observation_window
trace_mode: synthetic
physical_horizon_s: 86400
orbit_reference:
  orbit_type: sun_synchronous_like
  altitude_km: 500
  inclination_deg: 97
contact:
  contact_period_s: 5700
  contact_duration_s: 600
  contact_phase_offset_s: 420
  throughput_min_mbps: 35.0
  throughput_max_mbps: 65.0
  snr_min_db: 8.0
  snr_span_db: 12.0
  link_quality_period_s: 1800
  link_quality_phase: 0.5
task_stream_overrides:
  observation_windows_per_orbit: [2, 3]
  window_duration_s_range: [240, 360]
  intra_window_task_interval_slots: [2, 3]
  background_task_probability: 0.005
  emergency_window_probability: 0.12
  high_value_window_probability: 0.28
  forced_windows_s: []
deadline_distribution_target_minutes:
  routine: [30, 180]
  high_value: [20, 90]
  emergency: [15, 60]
deadline_distribution_status: target_only_current_dataset_adapter_uses_hardcoded_seconds
